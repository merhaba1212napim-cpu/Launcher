name: PojavLauncher APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 8 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradlew Yetkisi Ver
        run: chmod +x ./gradlew

      - name: APK Derle
        run: ./gradlew :app_pojavlauncher:assembleDebug

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-Custom-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
