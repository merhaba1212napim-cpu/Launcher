name: enhanced launcher v0.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Java 8
      - name: Java 8 Kur
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      # Java 17
      - name: Java 17 Kur
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Java 21
      - name: Java 21 Kur
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle Java 17 kullanacak
      - name: Java 17 Aktif Et
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      # Android SDK
      - name: Android SDK Kur
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://google.com
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # LTW kütüphanesini indir ve jniLibs icine cikart
      - name: LTW Kitapligini Indir ve Enjekte Et
        run: |
          mkdir -p app_pojavlauncher/libs app_pojavlauncher/src/main/jniLibs/arm64-v8a

          curl -fL --retry 3 \
            https://github.com \
            -o app_pojavlauncher/libs/ltw-release.aar

          test -s app_pojavlauncher/libs/ltw-release.aar
          unzip -q -j app_pojavlauncher/libs/ltw-release.aar "jni/arm64-v8a/*.so" -d app_pojavlauncher/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true

          echo "LTW kutuphanesi hazir:"
          ls -lh app_pojavlauncher/src/main/jniLibs/arm64-v8a/*ltw* 2>/dev/null || true

      # Microsoft Hesap Engelini Kalici Kapat
      - name: Microsoft Online Modu Zorunlulugunu Kapat
        run: |
          sed -i 's/if\s*(\s*isLocalProfile\s*)/if(false)/g' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/tasks/MinecraftDownloader.java

      # Gradle izinleri
      - name: Gradlew Yetkisi Ver
        run: chmod +x ./gradlew

      # Java sürümlerini Gradle'a tanıt
      - name: Java Toolchain Ayarla
        run: |
          echo "org.gradle.java.installations.paths=$JAVA_HOME_8_X64,$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # APK derle
      - name: PojavLauncher Derle
        run: |
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug

      # APK dosyasını kontrol et
      - name: APK Kontrol
        run: |
          ls -lh app_pojavlauncher/build/outputs/apk/debug/
          test -f app_pojavlauncher/build/outputs/apk/debug/*.apk

      # GitHub Release (Her derlemede otomatik guncellenir)
      - name: Release Olustur ve APK Yukle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          name: enhanced launcher v0.1-${{ github.run_number }}
          body: Java 8, 17 ve 21 destekli, yerel hesap indirmesi acik LTW ve ANGLE derlemesi.
          files: app_pojavlauncher/build/outputs/apk/debug/*.apk
