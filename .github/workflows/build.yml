name: enhanced launcher v0.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Gradlew Yetkisi Ver
        run: chmod +x ./gradlew

      - name: bug lar duzeltildi
        run: ./gradlew :app_pojavlauncher:assembleDebug

      - name: Release Olustur ve APK Yukle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1
          name: enhanced launcher v0.1
          body: bug lar duzeltildi
          files: app_pojavlauncher/build/outputs/apk/debug/*.apk
